<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bgGrad)"/>
  
  <!-- Browser frame -->
  <rect x="60" y="60" width="1160" height="680" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- Browser top bar -->
  <rect x="60" y="60" width="1160" height="50" rx="12" fill="#F1F5F9"/>
  <circle cx="90" cy="85" r="6" fill="#EF4444"/>
  <circle cx="110" cy="85" r="6" fill="#F59E0B"/>
  <circle cx="130" cy="85" r="6" fill="#10B981"/>
  
  <rect x="170" y="72" width="700" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="190" y="89" font-family="Arial, sans-serif" font-size="12" fill="#64748B">🔒 https://weibo.com/u/1234567890</text>
  
  <!-- Social media post area -->
  <rect x="80" y="130" width="700" height="590" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- Post header -->
  <circle cx="120" cy="170" r="20" fill="url(#accent)"/>
  <text x="120" y="175" font-family="Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#FFFFFF">技术</text>
  <text x="155" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#1E293B">科技前沿</text>
  <text x="155" y="182" font-family="Arial, sans-serif" font-size="11" fill="#64748B">2 小时前 · 来自微博 weibo.com</text>
  
  <!-- Post content -->
  <text x="100" y="220" font-family="Arial, sans-serif" font-size="13" fill="#1E293B">【AI 改变未来】最新研究表明，AI 技术正在深刻改变</text>
  <text x="100" y="240" font-family="Arial, sans-serif" font-size="13" fill="#1E293B">各行各业，从医疗到教育，从金融到制造。</text>
  <text x="100" y="260" font-family="Arial, sans-serif" font-size="13" fill="#1E293B">未来已来，让我们一起拥抱变化！</text>
  <text x="100" y="285" font-family="Arial, sans-serif" font-size="12" fill="#3B82F6">#AI技术 #未来已来 #科技创新</text>
  
  <!-- Post media -->
  <rect x="100" y="305" width="660" height="180" rx="8" fill="url(#accent)" opacity="0.8"/>
  <text x="430" y="400" font-family="Arial, sans-serif" font-size="48" text-anchor="middle" fill="#FFFFFF">🤖</text>
  
  <!-- Engagement stats -->
  <g transform="translate(100, 510)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" fill="#64748B">❤️ 1,234  🔄 567  💬 89</text>
  </g>
  
  <!-- Original engagement buttons -->
  <g transform="translate(100, 540)">
    <rect width="150" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="75" y="25" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748B">❤️ 点赞 (1,234)</text>
  </g>
  <g transform="translate(260, 540)">
    <rect width="150" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="75" y="25" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748B">⭐ 收藏</text>
  </g>
  <g transform="translate(420, 540)">
    <rect width="150" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="75" y="25" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748B">🔄 转发</text>
  </g>
  <g transform="translate(580, 540)">
    <rect width="150" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="75" y="25" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#64748B">💬 评论</text>
  </g>
  
  <!-- Comment section -->
  <g transform="translate(100, 600)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">热门评论</text>
    
    <g transform="translate(0, 15)">
      <circle cx="12" cy="20" r="10" fill="#3B82F6"/>
      <text x="12" y="24" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">A</text>
      <text x="32" y="18" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#1E293B">AI研究员</text>
      <text x="32" y="35" font-family="Arial, sans-serif" font-size="11" fill="#64748B">说得很好，AI 确实是未来趋势 👍</text>
    </g>
  </g>
  
  <!-- Side panel - AiBrand Quick Actions -->
  <rect x="800" y="130" width="400" height="590" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- Side panel header -->
  <rect x="800" y="130" width="400" height="50" rx="8" fill="url(#accent)"/>
  <text x="820" y="162" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">⚡ 一键互动</text>
  
  <!-- Action tabs -->
  <g transform="translate(820, 200)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#64748B">目标用户</text>
    <rect y="10" width="365" height="40" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="15" y="35" font-family="Arial, sans-serif" font-size="12" fill="#1E293B">@科技前沿</text>
    <text x="350" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="end" fill="#10B981">✓ 已登录</text>
  </g>
  
  <!-- Quick action buttons -->
  <text x="820" y="280" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">快速操作</text>
  
  <g transform="translate(820, 295)">
    <rect width="365" height="56" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
    <text x="30" y="35" font-family="Arial, sans-serif" font-size="24">❤️</text>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">点赞</text>
    <text x="80" y="42" font-family="Arial, sans-serif" font-size="10" fill="#64748B">对当前帖子点赞</text>
    <rect x="280" y="14" width="70" height="28" rx="14" fill="#EF4444"/>
    <text x="315" y="32" font-family="Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#FFFFFF">执行</text>
  </g>
  
  <g transform="translate(820, 361)">
    <rect width="365" height="56" rx="10" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
    <text x="30" y="35" font-family="Arial, sans-serif" font-size="24">⭐</text>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">收藏</text>
    <text x="80" y="42" font-family="Arial, sans-serif" font-size="10" fill="#64748B">收藏到我的收藏夹</text>
    <rect x="280" y="14" width="70" height="28" rx="14" fill="#F59E0B"/>
    <text x="315" y="32" font-family="Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#FFFFFF">执行</text>
  </g>
  
  <g transform="translate(820, 427)">
    <rect width="365" height="56" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <text x="30" y="35" font-family="Arial, sans-serif" font-size="24">➕</text>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">关注</text>
    <text x="80" y="42" font-family="Arial, sans-serif" font-size="10" fill="#64748B">关注 @科技前沿</text>
    <rect x="280" y="14" width="70" height="28" rx="14" fill="#3B82F6"/>
    <text x="315" y="32" font-family="Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#FFFFFF">执行</text>
  </g>
  
  <g transform="translate(820, 493)">
    <rect width="365" height="56" rx="10" fill="#F0FDF4" stroke="#10B981" stroke-width="2"/>
    <text x="30" y="35" font-family="Arial, sans-serif" font-size="24">🔄</text>
    <text x="80" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1E293B">分享</text>
    <text x="80" y="42" font-family="Arial, sans-serif" font-size="10" fill="#64748B">分享到其他平台</text>
    <rect x="280" y="14" width="70" height="28" rx="14" fill="#10B981"/>
    <text x="315" y="32" font-family="Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#FFFFFF">执行</text>
  </g>
  
  <!-- Status -->
  <g transform="translate(820, 570)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#64748B">操作日志</text>
    <g transform="translate(0, 10)">
      <rect width="365" height="50" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="1"/>
      <circle cx="20" cy="25" r="6" fill="#10B981"/>
      <text x="20" y="29" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#FFFFFF">✓</text>
      <text x="40" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#15803D">点赞成功</text>
      <text x="40" y="40" font-family="Arial, sans-serif" font-size="10" fill="#64748B">刚刚 · 自动操作完成</text>
    </g>
    <g transform="translate(0, 70)">
      <rect width="365" height="50" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
      <circle cx="20" cy="25" r="6" fill="#F59E0B"/>
      <text x="20" y="29" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#FFFFFF">⟳</text>
      <text x="40" y="22" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#B45309">收藏进行中</text>
      <text x="40" y="40" font-family="Arial, sans-serif" font-size="10" fill="#64748B">刚刚 · 正在保存到收藏夹</text>
    </g>
  </g>
</svg>
