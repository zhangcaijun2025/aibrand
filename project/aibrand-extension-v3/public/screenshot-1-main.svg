<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bgGrad)"/>
  
  <!-- Browser frame -->
  <rect x="60" y="60" width="1160" height="680" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  
  <!-- Browser top bar -->
  <rect x="60" y="60" width="1160" height="50" rx="12" fill="#F1F5F9"/>
  <circle cx="90" cy="85" r="6" fill="#EF4444"/>
  <circle cx="110" cy="85" r="6" fill="#F59E0B"/>
  <circle cx="130" cy="85" r="6" fill="#10B981"/>
  
  <!-- URL bar -->
  <rect x="170" y="72" width="700" height="26" rx="13" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
  <text x="190" y="89" font-family="Arial, sans-serif" font-size="12" fill="#64748B">🔒 https://aibrand.ai/editor</text>
  
  <!-- AiBrand button in toolbar -->
  <rect x="1100" y="72" width="100" height="26" rx="6" fill="url(#accent)"/>
  <text x="1150" y="89" font-family="Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" fill="#FFFFFF">✨ AiBrand</text>
  
  <!-- Main content area -->
  <rect x="80" y="130" width="700" height="590" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- Page title -->
  <text x="100" y="170" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#1E293B">内容编辑器</text>
  
  <!-- Title input -->
  <text x="100" y="210" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">标题</text>
  <rect x="100" y="220" width="660" height="40" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="115" y="245" font-family="Arial, sans-serif" font-size="13" fill="#1E293B">探索 AI 时代的创作新范式</text>
  
  <!-- Content textarea -->
  <text x="100" y="290" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">正文内容</text>
  <rect x="100" y="300" width="660" height="180" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="115" y="325" font-family="Arial, sans-serif" font-size="13" fill="#1E293B">在当今快速发展的数字时代，AI 技术正在重塑内容创作的方式。</text>
  <text x="115" y="345" font-family="Arial, sans-serif" font-size="13" fill="#1E293B">从文本生成到视觉设计，从数据分析到用户体验，</text>
  <text x="115" y="365" font-family="Arial, sans-serif" font-size="13" fill="#1E293B">AI 正在帮助创作者突破传统限制，释放无限创意潜能。</text>
  <text x="115" y="385" font-family="Arial, sans-serif" font-size="13" fill="#1E293B" opacity="0.5">#AI创作 #内容营销 #技术创新</text>
  
  <!-- Tags -->
  <text x="100" y="510" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#475569">标签</text>
  <g transform="translate(100, 520)">
    <rect width="80" height="28" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
    <text x="40" y="18" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#3B82F6">#AI创作</text>
  </g>
  <g transform="translate(190, 520)">
    <rect width="80" height="28" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
    <text x="40" y="18" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#3B82F6">#技术创新</text>
  </g>
  <g transform="translate(280, 520)">
    <rect width="80" height="28" rx="14" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
    <text x="40" y="18" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="#3B82F6">#内容营销</text>
  </g>
  
  <!-- Publish button -->
  <rect x="100" y="620" width="160" height="44" rx="8" fill="url(#accent)"/>
  <text x="180" y="648" font-family="Arial, sans-serif" font-size="14" font-weight="600" text-anchor="middle" fill="#FFFFFF">📤 一键发布</text>
  
  <!-- Side panel - AiBrand -->
  <rect x="800" y="130" width="400" height="590" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
  
  <!-- Side panel header -->
  <rect x="800" y="130" width="400" height="50" rx="8" fill="url(#accent)"/>
  <text x="820" y="162" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">✨ AiBrand 发布助手</text>
  
  <!-- Platform selection -->
  <text x="820" y="210" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">选择发布平台</text>
  
  <!-- Platform cards grid -->
  <g transform="translate(820, 225)">
    <rect width="115" height="80" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
    <text x="57" y="35" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">📱</text>
    <text x="57" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1E293B">微博</text>
    <circle cx="100" cy="15" r="8" fill="#10B981"/>
    <text x="100" y="19" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">✓</text>
  </g>
  
  <g transform="translate(945, 225)">
    <rect width="115" height="80" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
    <text x="57" y="35" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">🎵</text>
    <text x="57" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1E293B">抖音</text>
    <circle cx="100" cy="15" r="8" fill="#10B981"/>
    <text x="100" y="19" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">✓</text>
  </g>
  
  <g transform="translate(1070, 225)">
    <rect width="115" height="80" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="57" y="35" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">📕</text>
    <text x="57" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1E293B">小红书</text>
  </g>
  
  <g transform="translate(820, 315)">
    <rect width="115" height="80" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="2"/>
    <text x="57" y="35" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">📺</text>
    <text x="57" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1E293B">B站</text>
    <circle cx="100" cy="15" r="8" fill="#10B981"/>
    <text x="100" y="19" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">✓</text>
  </g>
  
  <g transform="translate(945, 315)">
    <rect width="115" height="80" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="57" y="35" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">💡</text>
    <text x="57" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1E293B">知乎</text>
  </g>
  
  <g transform="translate(1070, 315)">
    <rect width="115" height="80" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="57" y="35" font-family="Arial, sans-serif" font-size="24" text-anchor="middle">📰</text>
    <text x="57" y="60" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#1E293B">头条</text>
  </g>
  
  <!-- Status section -->
  <text x="820" y="430" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1E293B">发布状态</text>
  
  <g transform="translate(820, 445)">
    <rect width="365" height="60" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="1"/>
    <circle cx="20" cy="30" r="8" fill="#10B981"/>
    <text x="40" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#15803D">微博 - 发布成功</text>
    <text x="40" y="45" font-family="Arial, sans-serif" font-size="10" fill="#64748B">2 秒前 · 链接已复制</text>
  </g>
  
  <g transform="translate(820, 515)">
    <rect width="365" height="60" rx="8" fill="#F0FDF4" stroke="#10B981" stroke-width="1"/>
    <circle cx="20" cy="30" r="8" fill="#10B981"/>
    <text x="40" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#15803D">抖音 - 发布成功</text>
    <text x="40" y="45" font-family="Arial, sans-serif" font-size="10" fill="#64748B">5 秒前 · 视频上传完成</text>
  </g>
  
  <g transform="translate(820, 585)">
    <rect width="365" height="60" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
    <circle cx="20" cy="30" r="8" fill="#F59E0B"/>
    <text x="40" y="25" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#B45309">B站 - 发布中</text>
    <text x="40" y="45" font-family="Arial, sans-serif" font-size="10" fill="#64748B">正在上传封面...</text>
  </g>
  
  <!-- Bottom CTA -->
  <rect x="820" y="665" width="365" height="40" rx="8" fill="url(#accent)"/>
  <text x="1002" y="690" font-family="Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#FFFFFF">⚙️ 打开 AiBrand 设置</text>
</svg>
