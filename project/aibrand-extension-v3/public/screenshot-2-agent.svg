<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bgGrad)"/>
  
  <!-- Stars/particles -->
  <circle cx="100" cy="100" r="2" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="200" cy="150" r="1.5" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="300" cy="80" r="2" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="1100" cy="120" r="2" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="1200" cy="200" r="1.5" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="50" cy="700" r="2" fill="#FFFFFF" opacity="0.5"/>
  
  <!-- Browser frame -->
  <rect x="80" y="80" width="1120" height="640" rx="12" fill="#1E293B" stroke="#334155" stroke-width="2"/>
  
  <!-- Browser top bar -->
  <rect x="80" y="80" width="1120" height="44" rx="12" fill="#0F172A"/>
  <circle cx="110" cy="102" r="6" fill="#EF4444"/>
  <circle cx="130" cy="102" r="6" fill="#F59E0B"/>
  <circle cx="150" cy="102" r="6" fill="#10B981"/>
  
  <rect x="180" y="90" width="600" height="24" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="200" y="106" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">🔒 https://aibrand.ai/agent</text>
  
  <!-- Main content -->
  <rect x="100" y="144" width="1080" height="556" rx="8" fill="#0F172A"/>
  
  <!-- AI Agent header -->
  <g transform="translate(140, 180)">
    <circle cx="20" cy="20" r="20" fill="url(#aiGrad)"/>
    <text x="20" y="26" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#FFFFFF">AI</text>
    <text x="55" y="18" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">智能创作助手</text>
    <text x="55" y="36" font-family="Arial, sans-serif" font-size="11" fill="#94A3B8">Agent-Powered Content Creation</text>
  </g>
  
  <!-- Prompt input area -->
  <g transform="translate(140, 240)">
    <rect width="700" height="100" rx="12" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
    <text x="20" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">💭 提示词</text>
    <text x="20" y="58" font-family="Arial, sans-serif" font-size="14" fill="#E2E8F0">帮我写一条关于人工智能在内容创作领域应用的微博，</text>
    <text x="20" y="80" font-family="Arial, sans-serif" font-size="14" fill="#E2E8F0">要求专业但不失趣味，适合技术圈分享</text>
  </g>
  
  <!-- Generate button -->
  <g transform="translate(860, 240)">
    <rect width="120" height="100" rx="12" fill="url(#aiGrad)"/>
    <text x="60" y="45" font-family="Arial, sans-serif" font-size="28" text-anchor="middle" fill="#FFFFFF">✨</text>
    <text x="60" y="75" font-family="Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#FFFFFF">生成内容</text>
  </g>
  
  <!-- Page context card -->
  <g transform="translate(140, 360)">
    <rect width="840" height="60" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="20" y="25" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">🌐 当前页面上下文</text>
    <text x="20" y="45" font-family="Arial, sans-serif" font-size="12" fill="#CBD5E1">页面：探索 AI 时代的创作新范式 - 知乎专栏</text>
  </g>
  
  <!-- AI Response area -->
  <g transform="translate(140, 440)">
    <rect width="1000" height="180" rx="12" fill="#1E293B" stroke="#8B5CF6" stroke-width="2"/>
    
    <!-- AI badge -->
    <g transform="translate(20, 20)">
      <rect width="80" height="24" rx="12" fill="url(#aiGrad)"/>
      <text x="40" y="16" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#FFFFFF">AI 生成</text>
    </g>
    
    <!-- Confidence score -->
    <g transform="translate(880, 20)">
      <rect width="100" height="24" rx="12" fill="#10B981" opacity="0.2" stroke="#10B981" stroke-width="1"/>
      <text x="50" y="16" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#10B981">置信度 92%</text>
    </g>
    
    <!-- Generated content -->
    <text x="20" y="70" font-family="Arial, sans-serif" font-size="13" fill="#E2E8F0">🚀 AI 正在重新定义内容创作的边界！</text>
    <text x="20" y="92" font-family="Arial, sans-serif" font-size="13" fill="#E2E8F0">从智能写作到视觉生成，从数据分析到个性化推荐，</text>
    <text x="20" y="114" font-family="Arial, sans-serif" font-size="13" fill="#E2E8F0">AI 让创作者能够专注于创意本身，繁琐的执行工作交给机器。</text>
    <text x="20" y="136" font-family="Arial, sans-serif" font-size="13" fill="#E2E8F0">未来已来，你准备好了吗？</text>
    <text x="20" y="158" font-family="Arial, sans-serif" font-size="12" fill="#94A3B8">#AI创作 #未来已来 #内容创新</text>
  </g>
  
  <!-- Action suggestions -->
  <g transform="translate(140, 640)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">💡 Agent 建议</text>
    
    <g transform="translate(0, 15)">
      <rect width="200" height="44" rx="8" fill="url(#aiGrad)"/>
      <text x="100" y="27" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#FFFFFF">📤 发布到微博</text>
    </g>
    
    <g transform="translate(215, 15)">
      <rect width="200" height="44" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
      <text x="100" y="27" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#8B5CF6">✨ 优化文案</text>
    </g>
    
    <g transform="translate(430, 15)">
      <rect width="200" height="44" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
      <text x="100" y="27" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#8B5CF6">🔄 换个风格</text>
    </g>
    
    <g transform="translate(645, 15)">
      <rect width="200" height="44" rx="8" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
      <text x="100" y="27" font-family="Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#8B5CF6">📋 复制内容</text>
    </g>
  </g>
</svg>
