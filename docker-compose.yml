# 全局日志轮转锚点: 所有服务统一限制日志大小, 防止无限增长撑爆磁盘
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mongodb:
    image: mongo:latest
    container_name: aibrand-mongodb
    restart: unless-stopped
    logging: *default-logging
    entrypoint: ["bash", "-c", "openssl rand -base64 756 > /data/mongodb-keyfile && chmod 400 /data/mongodb-keyfile && chown mongodb:mongodb /data/mongodb-keyfile && exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/mongodb-keyfile"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    networks:
      - aibrand-network
      - ai-platform
    healthcheck:
      test: mongosh --quiet --eval "try { rs.status().ok } catch(e) { 0 }"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  mongodb-rs-init:
    image: mongo:latest
    container_name: aibrand-mongodb-rs-init
    depends_on:
      mongodb:
        condition: service_started
    entrypoint: ["/bin/sh", "-c", "sleep 5 && mongosh mongodb://admin:password@mongodb:27017/?authSource=admin --eval \"try { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongodb:27017'}]}) } catch(e) { if (e.codeName!=='AlreadyInitialized') throw e }\""]
    restart: "no"
    networks:
      - aibrand-network
      - ai-platform

  redis:
    image: redis:latest
    container_name: aibrand-redis
    restart: unless-stopped
    command: redis-server --requirepass password
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - aibrand-network
      - ai-platform
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

    logging: *default-logging

  rustfs:
    image: rustfs/rustfs:latest
    container_name: aibrand-rustfs
    hostname: rustfs.local
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - "9001:9001"
    volumes:
      - rustfs-data:/data
    networks:
      aibrand-network:
        aliases:
          - rustfs.local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    logging: *default-logging

  aibrand-init:
    image: node:lts-alpine
    container_name: aibrand-init
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./scripts/init.mjs:/app/init.mjs:ro
      - ./scripts/init-package.json:/app/package.json:ro
      - init-data:/data/init
    working_dir: /app
    environment:
      MONGO_URI: mongodb://admin:password@mongodb:27017
      JWT_SECRET: change-this-jwt-secret
      DB_NAME: aibrand
      AUTO_LOGIN_TOKEN_PATH: /data/init/token.txt
    entrypoint: /bin/sh -c "npm install --omit=dev 2>/dev/null && node init.mjs"
    networks:
      - aibrand-network
      - ai-platform

  rustfs-init:
    image: minio/mc:latest
    container_name: aibrand-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - aibrand-network
      - ai-platform
    entrypoint: >
      /bin/sh -c "
      mc alias set rustfs http://rustfs.local:9000 rustfsadmin rustfsadmin;
      mc mb rustfs/aibrand --ignore-existing;
      mc anonymous set download rustfs/aibrand;
      exit 0;
      "

  aibrand-ai:
    image: aibrand/ai:latest
    pull_policy: never
    container_name: aibrand-ai
    restart: unless-stopped
    ports:
      - "3011:3010"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./project/aibrand-backend/apps/aibrand-ai/config/config.js:/app/config.js:ro
    networks:
      - aibrand-network
      - ai-platform
    environment:
      NODE_ENV: production
      APP_ENV: production
      APP_NAME: aibrand-ai

      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_USERNAME: admin
      MONGODB_PASSWORD: password

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: password

      JWT_SECRET: change-this-jwt-secret
      INTERNAL_TOKEN: change-this-secret-token

      SERVER_URL: http://aibrand-server:3002

      ASSETS_CONFIG: '{"provider":"s3","region":"us-east-1","bucketName":"aibrand","endpoint":"http://rustfs.local:9000","publicEndpoint":"http://127.0.0.1:9000","cdnEndpoint":"http://127.0.0.1:8080/oss","accessKeyId":"rustfsadmin","secretAccessKey":"rustfsadmin","forcePathStyle":true}'

      # AI Services
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      VOLCENGINE_API_KEY: ""
      VOLCENGINE_ACCESS_KEY_ID: ""
      VOLCENGINE_SECRET_ACCESS_KEY: ""
      VOLCENGINE_VOD_SPACE_NAME: ""
      GROK_API_KEY: ""
      GEMINI_API_KEY: ""
      GEMINI_BASE_URL: ""
      GEMINI_KEY_PAIRS: '[]'
      GEMINI_LOCATION: us-central1
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging: *default-logging

  aibrand-server:
    image: aibrand/server:latest
    pull_policy: never
    container_name: aibrand-server
    restart: unless-stopped
    ports:
      - "3002:3002"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      aibrand-ai:
        condition: service_healthy
    volumes:
      - ./project/aibrand-backend/apps/aibrand-server/config/config.js:/app/config.js:ro
    networks:
      - aibrand-network
      - ai-platform
    environment:
      NODE_ENV: production
      APP_ENV: production
      APP_NAME: aibrand-server
      APP_DOMAIN: localhost

      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_USERNAME: admin
      MONGODB_PASSWORD: password

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: password

      AI_URL: http://aibrand-ai:3010

      JWT_SECRET: change-this-jwt-secret
      INTERNAL_TOKEN: change-this-secret-token

      ASSETS_CONFIG: '{"provider":"s3","region":"us-east-1","bucketName":"aibrand","endpoint":"http://rustfs.local:9000","publicEndpoint":"http://127.0.0.1:9000","cdnEndpoint":"http://127.0.0.1:8080/oss","accessKeyId":"rustfsadmin","secretAccessKey":"rustfsadmin","forcePathStyle":true}'

      MAIL_PASS: ""
      MAIL_HOST: host.docker.internal
      MAIL_PORT: 1025

      # Third-party OAuth
      BILIBILI_CLIENT_ID: ""
      BILIBILI_CLIENT_SECRET: ""
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      KWAI_CLIENT_ID: ""
      KWAI_CLIENT_SECRET: ""
      PINTEREST_CLIENT_ID: ""
      PINTEREST_CLIENT_SECRET: ""
      TIKTOK_CLIENT_ID: ""
      TIKTOK_CLIENT_SECRET: ""
      TWITTER_CLIENT_ID: ""
      TWITTER_CLIENT_SECRET: ""
      FACEBOOK_CLIENT_ID: ""
      FACEBOOK_CLIENT_SECRET: ""
      FACEBOOK_CONFIG_ID: ""
      THREADS_CLIENT_ID: ""
      THREADS_CLIENT_SECRET: ""
      INSTAGRAM_CLIENT_ID: ""
      INSTAGRAM_CLIENT_SECRET: ""
      LINKEDIN_CLIENT_ID: ""
      LINKEDIN_CLIENT_SECRET: ""
      YOUTUBE_CLIENT_ID: ""
      YOUTUBE_CLIENT_SECRET: ""
      WXPLAT_APP_ID: ""
      WXPLAT_APP_SECRET: ""
      WXPLAT_ENCODING_AES_KEY: ""
      DOYIN_CLIENT_ID: ""
      DOYIN_CLIENT_SECRET: ""

      # One API (LLM Gateway)
      NEW_API_BASE_URL: ${NEW_API_BASE_URL:-http://one-api:4012}
      NEW_API_TOKEN: ${NEW_API_TOKEN:-4T5LoSJJBuzfAVEl21B79188293542078d4dB1AcF8369e70}

      # Aliyun SMS
      ALI_SMS_ACCESS_KEY_ID: ""
      ALI_SMS_ACCESS_KEY_SECRET: ""
      ALI_SMS_SIGN_NAME: ""
      ALI_SMS_TEMPLATE_CODE: ""

      # Dify AI Platform
      DIFY_API_BASE: ${DIFY_API_BASE:-http://dify-api:5001}
      DIFY_APP_API_KEY: ${DIFY_APP_API_KEY:-}
      DIFY_ACCESS_TOKEN: ${DIFY_ACCESS_TOKEN:-}

      # n8n Workflow Engine
      N8N_BASE_URL: ${N8N_BASE_URL:-http://n8n:5678}
      N8N_API_KEY: ${N8N_API_KEY:-}

      # Relay (optional)
      RELAY_SERVER_URL: ${RELAY_SERVER_URL:-http://localhost:4011}
      RELAY_API_KEY: ${RELAY_API_KEY}
      RELAY_CALLBACK_URL: http://127.0.0.1:8080/api/plat/relay-callback
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging: *default-logging

  aibrand-web:
    image: aibrand/web:latest
    pull_policy: never
    container_name: aibrand-web
    restart: unless-stopped
    # 以 root 启动,command 中 chown 挂载的 .openclaw 目录后用 su-exec 切换 nextjs
    # 解决 bind mount 的 root 所有者导致 nextjs 无法 chmod state 目录的 EPERM 错误
    user: "0:0"
    ports:
      - "3001:3000"
    depends_on:
      aibrand-server:
        condition: service_healthy
    volumes:
      - init-data:/data/init:ro
      # 直接只读挂载 openclaw 配置 (status 端点只需读 sessions.json, 无 SQLite I/O 需求)
      # 之前用 cp 复制会导致 sessions.json 更新后容器看不到, 改为直接挂载实时读取
      - ./.openclaw:/home/nextjs/.openclaw:ro
      # L2.4: 进化引擎需要从容器写入 routing_rule overrides.json 到主机目录
      # 单独让 aibrand-evolution 子目录可写,其他 .openclaw 文件保持只读保护
      - ./.openclaw/custom-skills/aibrand-evolution:/home/nextjs/.openclaw/custom-skills/aibrand-evolution:rw
      # 持久化 local-db (telemetry / instincts / ab_experiments / geo_scores):
      # 容器重建不丢进化引擎学习数据
      - app-data:/app/data
    networks:
      - aibrand-network
      - ai-platform
    command:
      - /bin/sh
      - -c
      - |
        # openclaw-bridge 已支持 CLI 失败时直接调用 DeepSeek API,
        # 不再依赖 OpenClaw CLI 本地状态。保留 state 目录创建以防万一。
        mkdir -p /tmp/openclaw-state 2>/dev/null || true
        chown nextjs:nodejs /tmp/openclaw-state 2>/dev/null || true
        # local-db 数据卷 (telemetry/instincts/ab_experiments): 卷由 root 创建,
        # 应用以 nextjs 运行,必须 chown 才能写入
        mkdir -p /app/data 2>/dev/null || true
        chown nextjs:nodejs /app/data 2>/dev/null || true
        export AUTO_LOGIN_TOKEN=$$(cat /data/init/token.txt 2>/dev/null || echo '')
        exec su-exec nextjs node server.js
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      DATABASE_URL: "postgresql://postgres:aibrand123@aibrand-postgres:5432/aibrand"
      DEV_AUTO_LOGIN: "true"
      # LLM API Key (openclaw-bridge.ts 读取 OPENAI_API_KEY || DEEPSEEK_API_KEY)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${OPENAI_API_KEY:-}
      OPENCLAW_DEFAULT_AGENT: main
      # 容器环境用 --local 模式 (直接调用模型 API,不需要 Gateway)
      OPENCLAW_USE_LOCAL: "true"
      # Hermes 智能体: 容器经 host.docker.internal 调宿主机 Hermes Host Bridge (18791)
      HERMES_GATEWAY_URL: http://host.docker.internal:18791
      HERMES_BIN: hermes
      HERMES_MODEL: ${HERMES_MODEL:-}
      HERMES_PROVIDER: ${HERMES_PROVIDER:-}
      HERMES_TIMEOUT_MS: 90000
      # openclaw CLI 可写状态目录 (config 挂载为 ro, 此处指向 tmpfs 避免 EROFS)
      OPENCLAW_STATE_DIR: /tmp/openclaw-state
      # openclaw CLI 配置路径 (覆盖默认 ~/.openclaw)
      OPENCLAW_CONFIG_PATH: /home/nextjs/.openclaw/openclaw.json
      # OpenClaw Gateway 地址: 容器内 127.0.0.1 指 web 自身, 必须用 compose 服务名
      # (修复 /api/openclaw-gateway/status 500: 侧边栏 OpenClaw 状态组件)
      OPENCLAW_GATEWAY_URL: http://aibrand-openclaw:18789
      OPENCLAW_CONTROL_URL: http://aibrand-openclaw:18789
      # L4.2: 飞书凭据注入,用于 evolution-im-notifier 兜底调用 sendFeishuMessage
      # (Next.js standalone module isolation 下 serverBinding 可能跨 route 丢失)
      FEISHU_APP_ID: ${FEISHU_APP_ID:-cli_a97a83ace1359bd2}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-t6CDrZgEg0Hm8EZaUKMU1gnRveh1GLOA}

      # Redis 连接 (visual-redis / cache-layer)
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: password

      # GEO 模块: production 模式允许 Mock 采集器
      GEO_MOCK_MODE: "true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── One API: LLM API Gateway ──
    logging: *default-logging

  one-api:
    image: justsong/one-api:latest
    container_name: one-api
    restart: unless-stopped
    ports:
      - "4012:3000"
    environment:
      TZ: Asia/Shanghai
      TIKTOKEN_CACHE_DIR: /data/tiktoken-cache
    volumes:
      - one-api-data:/data
    networks:
      - aibrand-network
      - ai-platform

  # ── OpenClaw: 个人 AI 助手 Gateway (23+ IM 平台接入) ──
    logging: *default-logging

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: aibrand-openclaw
    restart: unless-stopped
    ports:
      - "18789:18789"   # Gateway API
      - "18790:18790"   # Control UI
    volumes:
      - openclaw-data:/home/node/.openclaw
      - ./config/openclaw/openclaw.json:/home/node/.openclaw/openclaw.json:ro
      - ./skills/openclaw:/home/node/.openclaw/workspace/skills:ro
    environment:
      TZ: Asia/Shanghai
      # 修复: 镜像默认用户 node (uid 1000), HOME 被 Docker Desktop 注入为 Windows 路径 (C:UsersXIAOMI),
      # 且 /root/.openclaw 为 root 拥有导致 EACCES; 统一改挂载到 node 家目录并显式设 HOME
      HOME: /home/node
      # 复用 AiBrand 的 DeepSeek Key (openclaw-bridge.ts 同源)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${OPENAI_API_KEY:-}
      # 模型配置 (与 Claude Code 一致: deepseek-v4-pro)
      OPENCLAW_AGENT_MODEL: ${DEEPSEEK_MODEL:-deepseek/deepseek-v4-flash}
      OPENCLAW_THINKING: medium
      # Gateway 认证 token (容器环境 bind=auto 必须带 auth; 从 .env 注入避免硬编码)
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      # 沙盒配置 (Local 模式,与 AiBrand 同容器网络)
      OPENCLAW_SANDBOX_MODE: non-main
      OPENCLAW_SANDBOX_BACKEND: docker
    networks:
      - aibrand-network
      - ai-platform
    healthcheck:
      # openclaw 镜像无 wget/curl, 用 node 探测
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:18789/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) }).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    logging: *default-logging

  nginx:
    image: nginx:alpine
    container_name: aibrand-nginx
    restart: unless-stopped
    depends_on:
      aibrand-web:
        condition: service_healthy
      aibrand-server:
        condition: service_healthy
      aibrand-ai:
        condition: service_healthy
    ports:
      - "3099:80"
      - "8080:80"
      - "443:443"
      - "9000:9000"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks:
      - aibrand-network
      - ai-platform
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/_nhealth"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging


networks:
  aibrand-network:
    driver: bridge
    name: aibrand-network
  ai-platform:
    external: true
    name: ai-platform

volumes:
  mongodb-data:
    driver: local
  mongodb-config:
    driver: local
  redis-data:
    driver: local
  rustfs-data:
    driver: local
  init-data:
    driver: local
  one-api-data:
  openclaw-data:
    driver: local
  app-data:
    driver: local










