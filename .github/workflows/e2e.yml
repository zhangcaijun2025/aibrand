name: AiBrand E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  MONOREPO_DIR: project/aibrand-studio

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-smoke:
    name: E2E Smoke（静态页）
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: ${{ env.MONOREPO_DIR }}/pnpm-lock.yaml

      - name: Install
        working-directory: ${{ env.MONOREPO_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Install Playwright chromium
        working-directory: ${{ env.MONOREPO_DIR }}
        run: pnpm exec playwright install chromium --with-deps

      - name: Build
        working-directory: ${{ env.MONOREPO_DIR }}
        run: pnpm build

      - name: Run static smoke e2e
        working-directory: ${{ env.MONOREPO_DIR }}
        run: pnpm exec playwright test --project=smoke
        env:
          CI: 'true'

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ${{ env.MONOREPO_DIR }}/test-results/html-report
          if-no-files-found: ignore
