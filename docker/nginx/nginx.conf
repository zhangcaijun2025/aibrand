user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker DNS resolver — enables dynamic re-resolution of container names
    # Prevents 502 when aibrand-web container is recreated (IP changes)
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;

    client_max_body_size 50m;

    # ── Rate Limiting Zones (dev: generous limits for local development) ──
    # NOTE: 2000r/m per IP — all Docker traffic shares $binary_remote_addr,
    # so this is effectively a global limit. Burst:50 allows short spikes.
    limit_req_zone $binary_remote_addr zone=api:10m rate=2000r/m;
    limit_req_zone $binary_remote_addr zone=login:10m rate=200r/m;

    map $http_origin $cors_origin {
        default "";
        "~^https?://(.*\.)?aibrand\..*$" $http_origin;
        "~^https?://localhost(:[0-9]+)?$" $http_origin;
        "~^https?://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
        "~^https?://0\.0\.0\.0(:[0-9]+)?$" $http_origin;
    }

    # WebSocket 升级映射 (Next.js HMR / _next/webpack-hmr 需要)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Hide backend CORS headers, managed by nginx
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Max-Age;

    proxy_connect_timeout 120s;
    proxy_send_timeout 60s;
    proxy_read_timeout 86400s;

    # Upstream retry: 当 aibrand-web 容器重启/崩溃后自动重试
    # (容器重启时 IP 变更, Docker DNS resolver 会重新解析)
    proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    proxy_next_upstream_tries 3;
    proxy_next_upstream_timeout 30s;

    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET, HEAD, POST, PUT, DELETE, PATCH, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Accept, Accept-Encoding, Accept-Language, Authorization, Cache-Control, Content-Type, Cookie, DNT, Origin, Pragma, Referer, User-Agent, X-Requested-With, X-Request-ID, X-CSRF-Token, X-Auth-Token, X-HTTP-Method-Override, Next-Router-Prefetch, Next-Router-State-Tree, Next-Url, RSC, Sec-CH-UA, Sec-CH-UA-Mobile, Sec-CH-UA-Platform, Sec-Fetch-Dest, Sec-Fetch-Mode, Sec-Fetch-Site, Priority, If-None-Match, If-Modified-Since" always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Max-Age 86400 always;

    # HTTPS server (aibrand.local)
    server {
        listen 443 ssl;
        http2 on;
        server_name aibrand.local *.aibrand.local;

        ssl_certificate /etc/nginx/certs/aibrand.local.crt;
        ssl_certificate_key /etc/nginx/certs/aibrand.local.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # ── Security Headers ──
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; img-src 'self' data: https: http://localhost:* http://host.docker.internal:*; font-src 'self' https://fonts.gstatic.com; connect-src 'self' http://localhost:* http://host.docker.internal:* https:; frame-src 'self'; object-src 'none'; base-uri 'self'" always;

        # ── Rate Limiting (server-level API zone only) ──
        limit_req zone=api burst=50 nodelay;

        # Dynamic upstream (re-resolved via Docker DNS, prevents 502 on container recreate)
        set $upstream_web aibrand-web;

        location = /_nhealth {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # ComfyUI 本地引擎同源代理 (图片/WS 直连, 避免浏览器混合内容)
        location /comfy/ {
            proxy_pass http://host.docker.internal:8188/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Login-specific rate limiting (only applies to login paths)
        location /api/login/ {
            limit_req zone=login burst=10 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://aibrand-server:3002;
        }

        location /api/ai/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://aibrand-ai:3010;
        }

        # SSE 端点: 关闭 buffering, 延长 read_timeout, 防止 "Connection closed" 错误
        # 匹配 /api/system/monitor?stream=1 等所有 SSE 流式端点
        location ~ ^/api/(system/monitor|evolution/telemetry|stream) {
            proxy_pass http://$upstream_web:3000;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            chunked_transfer_encoding off;
        }

        location /api/ {
            proxy_pass http://$upstream_web:3000;
        }

        location /oss/ {
            proxy_pass http://aibrand-rustfs:9000/aibrand/;
        }

        # Next.js 静态资源: chunk 文件名含 content hash, 可长缓存 (immutable)
        # 减少 304 请求往返, 加速二次访问
        # 注意: 此处不使用 add_header (会覆盖 server 级安全头), 用 expires 单独设置 Cache-Control
        location /_next/static/ {
            access_log off;
            proxy_pass http://$upstream_web:3000;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            # 重新声明 server 级安全头 (nginx add_header 不继承父级当 location 有 add_header)
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }

        location / {
            proxy_pass http://$upstream_web:3000;
            # P4 修复: HTML 不缓存 (Next.js 首页 x-nextjs-prerender 导致 s-maxage=1y,
            # 部署后浏览器拿旧 HTML 引用旧 chunk → JS 崩溃 → 发消息无反应)
            # 静态资源 /_next/static/ 带 hash, 保持 immutable 1y 即可
            proxy_hide_header Cache-Control;
            proxy_hide_header ETag;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
    }

    # HTTP server (redirect to HTTPS for aibrand.local, serve others)
    server {
        listen 80;
        server_name _;

        # ── Security Headers (except HSTS - only on HTTPS) ──
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ── Rate Limiting (server-level API zone only) ──
        limit_req zone=api burst=50 nodelay;

        # Dynamic upstream (re-resolved via Docker DNS, prevents 502 on container recreate)
        set $upstream_web aibrand-web;

        location = /_nhealth {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # ComfyUI 本地引擎同源代理 (图片/WS 直连, 避免浏览器混合内容)
        location /comfy/ {
            proxy_pass http://host.docker.internal:8188/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Login-specific rate limiting (only applies to login paths)
        location /api/login/ {
            limit_req zone=login burst=10 nodelay;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://aibrand-server:3002;
        }

        location /api/ai/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://aibrand-ai:3010;
        }

        # SSE 端点: 关闭 buffering, 延长 read_timeout, 防止 "Connection closed" 错误
        # 匹配 /api/system/monitor?stream=1 等所有 SSE 流式端点
        location ~ ^/api/(system/monitor|evolution/telemetry|stream) {
            proxy_pass http://$upstream_web:3000;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            chunked_transfer_encoding off;
        }

        location /api/ {
            proxy_pass http://$upstream_web:3000;
        }

        location /oss/ {
            proxy_pass http://aibrand-rustfs:9000/aibrand/;
        }

        # Next.js 静态资源: chunk 文件名含 content hash, 可长缓存 (immutable)
        # 减少 304 请求往返, 加速二次访问
        # 注意: 此处不使用 add_header (会覆盖 server 级安全头), 用 expires 单独设置 Cache-Control
        location /_next/static/ {
            access_log off;
            proxy_pass http://$upstream_web:3000;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            # 重新声明 server 级安全头 (nginx add_header 不继承父级当 location 有 add_header)
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        }

        # AI智能创作工作台 - 智能版（独立静态HTML）
        # 2026-08-19: 改为代理到 aibrand-web（public/ 下有最新文件），
        # 避免 nginx 镜像层中的旧文件（重启丢失/版本过期）
        location = /智创中心/智能版 {
            proxy_pass http://$upstream_web:3000/ai-workbench-smart.html;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
        location = /ai-workbench-smart.html {
            proxy_pass http://$upstream_web:3000;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
        location = /iframe-test.html {
            proxy_pass http://$upstream_web:3000;
        }

        location / {
            proxy_pass http://$upstream_web:3000;
            # P4 修复: HTML 不缓存 (Next.js 首页 x-nextjs-prerender 导致 s-maxage=1y,
            # 部署后浏览器拿旧 HTML 引用旧 chunk → JS 崩溃 → 发消息无反应)
            # 静态资源 /_next/static/ 带 hash, 保持 immutable 1y 即可
            proxy_hide_header Cache-Control;
            proxy_hide_header ETag;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        }
    }

    # S3 代理：浏览器通过此端口上传文件到 rustfs
    server {
        listen 9000;
        listen [::]:9000;
        server_name _;

        client_max_body_size 500m;

        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, HEAD, PUT, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers * always;
        add_header Access-Control-Expose-Headers "ETag" always;
        add_header Access-Control-Max-Age 86400 always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        location / {
            proxy_pass http://aibrand-rustfs:9000;
            proxy_set_header Host $http_host;
            proxy_http_version 1.1;
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }
    }
}
